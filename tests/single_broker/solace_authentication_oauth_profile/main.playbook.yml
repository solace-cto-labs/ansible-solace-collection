-
  name: "main: solace_authentication_oauth_profile"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_authentication_oauth_profile: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_authentication_oauth_profile_client_required_claim: *sc
    solace.pubsub_plus.solace_authentication_oauth_profile_resource_server_required_claim: *sc
    solace.pubsub_plus.solace_get_authentication_oauth_profiles: *sc
    solace.pubsub_plus.solace_get_authentication_oauth_profile_client_required_claims: *sc
    solace.pubsub_plus.solace_get_authentication_oauth_profile_resource_server_required_claims: *sc
  vars:
    oauth_profile_name: "asct_oauth_profile"
  tasks:
    - name: "clean start"
      solace_authentication_oauth_profile:
        name: "{{ oauth_profile_name }}"
        state: absent

    - name: "add oauth profile"
      solace_authentication_oauth_profile:
        name: "{{ oauth_profile_name }}"
        settings:
          enabled: false
        state: present

    - name: "add client required claim"
      solace_authentication_oauth_profile_client_required_claim:
        name: "asct_client_claim"
        oauth_profile_name: "{{ oauth_profile_name }}"
        settings:
          clientRequiredClaimValue: '"asct-value"'
        state: present

    - name: "add resource server required claim"
      solace_authentication_oauth_profile_resource_server_required_claim:
        name: "asct_rs_claim"
        oauth_profile_name: "{{ oauth_profile_name }}"
        settings:
          resourceServerRequiredClaimValue: '"asct-value"'
        state: present

    - name: "get client required claims"
      solace_get_authentication_oauth_profile_client_required_claims:
        oauth_profile_name: "{{ oauth_profile_name }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get resource server required claims"
      solace_get_authentication_oauth_profile_resource_server_required_claims:
        oauth_profile_name: "{{ oauth_profile_name }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get oauth profiles"
      solace_get_authentication_oauth_profiles:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove client required claim"
      solace_authentication_oauth_profile_client_required_claim:
        name: "asct_client_claim"
        oauth_profile_name: "{{ oauth_profile_name }}"
        state: absent

    - name: "remove resource server required claim"
      solace_authentication_oauth_profile_resource_server_required_claim:
        name: "asct_rs_claim"
        oauth_profile_name: "{{ oauth_profile_name }}"
        state: absent

    - name: "remove oauth profile"
      solace_authentication_oauth_profile:
        name: "{{ oauth_profile_name }}"
        state: absent

###
# The End.
