# NOTE: kafka bridging requires a broker that supports it (10.10+). The
# bootstrapAddressList / authentication settings may need adjusting for your broker.

-
  name: "main: solace_kafka_receiver"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_kafka_receiver: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_kafka_receiver_topic_binding: *sc
    solace.pubsub_plus.solace_get_kafka_receivers: *sc
    solace.pubsub_plus.solace_get_kafka_receiver_topic_bindings: *sc
  vars:
    receiver: "asct-receiver"
  tasks:
    - name: "clean start"
      solace_kafka_receiver:
        name: "{{ receiver }}"
        state: absent

    - name: "add receiver"
      solace_kafka_receiver:
        name: "{{ receiver }}"
        settings:
          enabled: false
          bootstrapAddressList: "kafka1.example.com:9092"
        state: present

    - name: "add topic binding"
      solace_kafka_receiver_topic_binding:
        name: "asct-topic"
        kafka_receiver_name: "{{ receiver }}"
        state: present

    - name: "get topic bindings"
      solace_get_kafka_receiver_topic_bindings:
        kafka_receiver_name: "{{ receiver }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get receivers"
      solace_get_kafka_receivers:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove topic binding"
      solace_kafka_receiver_topic_binding:
        name: "asct-topic"
        kafka_receiver_name: "{{ receiver }}"
        state: absent

    - name: "remove receiver"
      solace_kafka_receiver:
        name: "{{ receiver }}"
        state: absent

###
# The End.
