# docker-compose -f PubSubStandard_singleNode.yml up
services:
  primary:
    # container_name: "${brokerDockerContainerName}"
    container_name: "asct-pubSubStandardSingleNodeCert"
    image: "${BROKER_DOCKER_IMAGE}"
    restart: unless-stopped
    shm_size: 1g
    ulimits:
      core: 2
      nofile:
        soft: 4096
        hard: 1048576
    volumes:
      - ${HOST_MOUNT_PATH_SECRETS_DIR}:/run/secrets
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 1
    ports:
      #SEMP over TLS
      - '8943:1943'
      #SEMP / Broker Manager
      - '8081:8080'
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
      - system_scaling_maxconnectioncount=1000
      - system_scaling_maxkafkabridgecount=10
      - system_scaling_maxkafkabrokerconnectioncount=300
      #- routername=ansible-solace__test
      - "tls_servercertificate_filepath=/run/secrets/${CERT_FILE}"



