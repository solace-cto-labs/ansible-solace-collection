-
  name: "solace_rdp_rest_consumer_oauth_jwt_claim"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_rdp: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_rdp_rest_consumer: *sc
    solace.pubsub_plus.solace_rdp_rest_consumer_oauth_jwt_claim: *sc
    solace.pubsub_plus.solace_get_rdp_rest_consumer_oauth_jwt_claims: *sc
  vars:
    rdp: "asct-rdp"
    rest_consumer: "asct-rest-consumer"
  tasks:
    - name: "create rdp"
      solace_rdp:
        name: "{{ rdp }}"
        settings:
          enabled: false
        state: present

    - name: "create rest consumer"
      solace_rdp_rest_consumer:
        name: "{{ rest_consumer }}"
        rdp_name: "{{ rdp }}"
        settings:
          enabled: false
          remoteHost: "rest.example.com"
          remotePort: 443
          tlsEnabled: true
        state: present

    - name: "add oauth jwt claim"
      solace_rdp_rest_consumer_oauth_jwt_claim:
        name: "asct-claim"
        rest_consumer_name: "{{ rest_consumer }}"
        rdp_name: "{{ rdp }}"
        settings:
          oauthJwtClaimValue: '"asct-value"'
        state: present

    - name: "get oauth jwt claims"
      solace_get_rdp_rest_consumer_oauth_jwt_claims:
        rdp_name: "{{ rdp }}"
        rest_consumer_name: "{{ rest_consumer }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "remove oauth jwt claim"
      solace_rdp_rest_consumer_oauth_jwt_claim:
        name: "asct-claim"
        rest_consumer_name: "{{ rest_consumer }}"
        rdp_name: "{{ rdp }}"
        state: absent

    - name: "remove rdp (cascades rest consumer)"
      solace_rdp:
        name: "{{ rdp }}"
        state: absent

###
# The End.
