# NOTE: solace_proxy is a broker-global object (no msg_vpn).

-
  name: "main: solace_proxy (broker)"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_proxy: &bc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
    solace.pubsub_plus.solace_get_proxies: *bc
  vars:
    proxy: "asct-proxy"
  tasks:
    - name: "clean start"
      solace_proxy:
        name: "{{ proxy }}"
        state: absent

    - name: "add"
      solace_proxy:
        name: "{{ proxy }}"
        settings:
          proxyType: http
          host: proxy.example.com
          port: 3128
        state: present

    - name: "update"
      solace_proxy:
        name: "{{ proxy }}"
        settings:
          port: 8080
        state: present

    - name: "get list"
      solace_get_proxies:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove"
      solace_proxy:
        name: "{{ proxy }}"
        state: absent

###
# The End.
