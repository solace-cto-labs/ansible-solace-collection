# NOTE: solace_vpn_proxy targets /msgVpns/{msgVpnName}/proxies/{proxyName}. Confirm your
# broker exposes a per-VPN proxy object; adjust settings as needed.

-
  name: "solace_vpn_proxy"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_vpn_proxy: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_get_vpn_proxies: *sc
  vars:
    proxy: "asct-vpn-proxy"
  tasks:
    - name: "clean start"
      solace_vpn_proxy:
        name: "{{ proxy }}"
        state: absent

    - name: "add"
      solace_vpn_proxy:
        name: "{{ proxy }}"
        settings:
          proxyType: http
          host: proxy.example.com
          port: 3128
        state: present

    - name: "update"
      solace_vpn_proxy:
        name: "{{ proxy }}"
        settings:
          port: 8080
        state: present

    - name: "get list"
      solace_get_vpn_proxies:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove"
      solace_vpn_proxy:
        name: "{{ proxy }}"
        state: absent

###
# The End.
