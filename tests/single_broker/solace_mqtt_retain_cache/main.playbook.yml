-
  name: "main: solace_mqtt_retain_cache"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_mqtt_retain_cache: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_get_mqtt_retain_caches: *sc
  vars:
    cache: "asct-retain-cache"
  tasks:
    - name: "clean start"
      solace_mqtt_retain_cache:
        name: "{{ cache }}"
        state: absent

    - name: "add"
      solace_mqtt_retain_cache:
        name: "{{ cache }}"
        settings:
          enabled: false
        state: present

    - name: "update"
      solace_mqtt_retain_cache:
        name: "{{ cache }}"
        settings:
          msgLifetime: 3600
        state: present

    - name: "get list"
      solace_get_mqtt_retain_caches:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove"
      solace_mqtt_retain_cache:
        name: "{{ cache }}"
        state: absent

###
# The End.
