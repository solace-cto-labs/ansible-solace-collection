# NOTE: kafka bridging requires a broker that supports it (10.10+). The
# bootstrapAddressList / kafkaTopicName settings may need adjusting for your broker.
# The queue binding binds an existing broker queue, so a queue is created first.

-
  name: "main: solace_kafka_sender"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_kafka_sender: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_kafka_sender_queue_binding: *sc
    solace.pubsub_plus.solace_get_kafka_senders: *sc
    solace.pubsub_plus.solace_get_kafka_sender_queue_bindings: *sc
    solace.pubsub_plus.solace_queue: *sc
  vars:
    sender: "asct-sender"
    queue: "asct-sender-queue"
  tasks:
    - name: "clean start: sender"
      solace_kafka_sender:
        name: "{{ sender }}"
        state: absent

    - name: "create queue (binding target)"
      solace_queue:
        name: "{{ queue }}"
        state: present

    - name: "add sender"
      solace_kafka_sender:
        name: "{{ sender }}"
        settings:
          enabled: false
          bootstrapAddressList: "kafka1.example.com:9092"
        state: present

    - name: "add queue binding"
      solace_kafka_sender_queue_binding:
        name: "{{ queue }}"
        kafka_sender_name: "{{ sender }}"
        settings:
          remoteTopic: "asct-topic"
        state: present

    - name: "get queue bindings"
      solace_get_kafka_sender_queue_bindings:
        kafka_sender_name: "{{ sender }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get senders"
      solace_get_kafka_senders:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove queue binding"
      solace_kafka_sender_queue_binding:
        name: "{{ queue }}"
        kafka_sender_name: "{{ sender }}"
        state: absent

    - name: "remove sender"
      solace_kafka_sender:
        name: "{{ sender }}"
        state: absent

    - name: "remove queue"
      solace_queue:
        name: "{{ queue }}"
        state: absent

###
# The End.
