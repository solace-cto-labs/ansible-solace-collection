# NOTE: the condition 'source' / 'expression' values below may need adjusting to
# valid enum values for your broker version.

-
  name: "main: solace_cert_matching_rule"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_cert_matching_rule: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_cert_matching_rule_condition: *sc
    solace.pubsub_plus.solace_cert_matching_rule_attribute_filter: *sc
    solace.pubsub_plus.solace_get_cert_matching_rules: *sc
    solace.pubsub_plus.solace_get_cert_matching_rule_conditions: *sc
    solace.pubsub_plus.solace_get_cert_matching_rule_attribute_filters: *sc
  vars:
    rule: "asct-rule"
  tasks:
    - name: "clean start"
      solace_cert_matching_rule:
        name: "{{ rule }}"
        state: absent

    - name: "add rule"
      solace_cert_matching_rule:
        name: "{{ rule }}"
        settings:
          enabled: false
        state: present

    - name: "add condition"
      solace_cert_matching_rule_condition:
        source: "certificate-thumbprint"
        cert_matching_rule_name: "{{ rule }}"
        settings:
          expression: "asct*"
        state: present

    - name: "add attribute filter"
      solace_cert_matching_rule_attribute_filter:
        name: "asct-filter"
        cert_matching_rule_name: "{{ rule }}"
        settings:
          attributeName: "asct-attribute"
          attributeValue: "asct-value"
        state: present

    - name: "get conditions"
      solace_get_cert_matching_rule_conditions:
        cert_matching_rule_name: "{{ rule }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get attribute filters"
      solace_get_cert_matching_rule_attribute_filters:
        cert_matching_rule_name: "{{ rule }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 1

    - name: "get rules"
      solace_get_cert_matching_rules:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "remove condition"
      solace_cert_matching_rule_condition:
        source: "certificate-thumbprint"
        cert_matching_rule_name: "{{ rule }}"
        state: absent

    - name: "remove attribute filter"
      solace_cert_matching_rule_attribute_filter:
        name: "asct-filter"
        cert_matching_rule_name: "{{ rule }}"
        state: absent

    - name: "remove rule"
      solace_cert_matching_rule:
        name: "{{ rule }}"
        state: absent

###
# The End.
