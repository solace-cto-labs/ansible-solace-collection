-
  name: "main: solace_authentication_kerberos_realm"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_authentication_kerberos_realm: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_get_authentication_kerberos_realms: *sc
  vars:
    realm: "@EXAMPLE.COM"
  tasks:
    - name: "clean start"
      solace_authentication_kerberos_realm:
        name: "{{ realm }}"
        state: absent

    - name: "add"
      solace_authentication_kerberos_realm:
        name: "{{ realm }}"
        state: present

    - name: "get list (config)"
      solace_get_authentication_kerberos_realms:
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count >= 1

    - name: "get list (monitor)"
      solace_get_authentication_kerberos_realms:
        api: monitor
      register: result
    - assert:
        that:
          - result.rc == 0

    - name: "remove"
      solace_authentication_kerberos_realm:
        name: "{{ realm }}"
        state: absent

###
# The End.
