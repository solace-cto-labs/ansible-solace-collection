# NOTE: creating a replay log is not supported on Solace Cloud; run on a self-hosted broker.

-
  name: "solace_replay_log_topic_filter_subscriptions"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  module_defaults:
    solace.pubsub_plus.solace_replay_log: &sc
      host: "{{ sempv2_host }}"
      port: "{{ sempv2_port }}"
      secure_connection: "{{ sempv2_is_secure_connection }}"
      username: "{{ sempv2_username }}"
      password: "{{ sempv2_password }}"
      timeout: "{{ sempv2_timeout }}"
      msg_vpn: "{{ vpn }}"
    solace.pubsub_plus.solace_replay_log_topic_filter_subscription: *sc
    solace.pubsub_plus.solace_replay_log_topic_filter_subscriptions: *sc
    solace.pubsub_plus.solace_get_replay_log_topic_filter_subscriptions: *sc
  vars:
    replay_log: "asct-replay-log"
  tasks:
    - name: "create replay log"
      solace_replay_log:
        name: "{{ replay_log }}"
        settings:
          maxSpoolUsage: 10
        state: present

    - name: "add topic filter subscription (singular)"
      solace_replay_log_topic_filter_subscription:
        topic: "asct/single/>"
        replay_log_name: "{{ replay_log }}"
        state: present

    - name: "add topic filter subscriptions (bulk)"
      solace_replay_log_topic_filter_subscriptions:
        replay_log_name: "{{ replay_log }}"
        topics:
          - "asct/bulk/a/>"
          - "asct/bulk/b/>"
        state: present

    - name: "get topic filter subscriptions"
      solace_get_replay_log_topic_filter_subscriptions:
        replay_log_name: "{{ replay_log }}"
      register: result
    - assert:
        that:
          - result.rc == 0
          - result.result_list_count == 3

    - name: "remove topic filter subscriptions (bulk)"
      solace_replay_log_topic_filter_subscriptions:
        replay_log_name: "{{ replay_log }}"
        topics: []
        state: exactly

    - name: "remove replay log"
      solace_replay_log:
        name: "{{ replay_log }}"
        state: absent

###
# The End.
