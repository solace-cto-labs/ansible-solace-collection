#
# FULL lifecycle test for solace_cloud_service_v2: CREATE -> verify -> DELETE a service.
#
# WARNING: this PROVISIONS and then DELETES a real Solace Cloud event broker service
# (billable, takes several minutes). It is intentionally NOT part of _run.sh - run it
# manually and deliberately. Sensitive/account data is read from the environment.
#
#   SOLACE_CLOUD_API_TOKEN          (required)
#   SOLACE_CLOUD_DATACENTER_ID      (required, a datacenter id from your account)
#   SOLACE_CLOUD_HOME               (optional, default 'us')
#   SOLACE_CLOUD_CREATE_SERVICE_NAME (optional, default 'pglab-1')
#   SOLACE_CLOUD_SERVICE_CLASS_ID    (optional, default 'DEVELOPER')

-
  name: "solace_cloud_service_v2 full lifecycle (create + delete)"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  vars:
    solace_cloud_api_token: "{{ lookup('env', 'SOLACE_CLOUD_API_TOKEN') }}"
    solace_cloud_home: "{{ lookup('env', 'SOLACE_CLOUD_HOME') | default('us', true) }}"
    service_name: "{{ lookup('env', 'SOLACE_CLOUD_CREATE_SERVICE_NAME') | default('pglab-1', true) }}"
    service_class_id: "{{ lookup('env', 'SOLACE_CLOUD_SERVICE_CLASS_ID') | default('DEVELOPER', true) }}"
    datacenter_id: "{{ lookup('env', 'SOLACE_CLOUD_DATACENTER_ID') }}"
  module_defaults:
    solace.pubsub_plus.solace_cloud_service_v2:
      solace_cloud_api_token: "{{ solace_cloud_api_token }}"
      solace_cloud_home: "{{ solace_cloud_home }}"
      wait_timeout_minutes: 40
  tasks:
    - name: "check required environment"
      assert:
        that:
          - solace_cloud_api_token | length > 0
          - datacenter_id | length > 0
        fail_msg: "set env vars SOLACE_CLOUD_API_TOKEN and SOLACE_CLOUD_DATACENTER_ID"

    - name: "clean start: ensure service absent"
      solace_cloud_service_v2:
        name: "{{ service_name }}"
        state: absent

    - name: "create service (async, waits for completion)"
      solace_cloud_service_v2:
        name: "{{ service_name }}"
        settings:
          serviceClassId: "{{ service_class_id }}"
          datacenterId: "{{ datacenter_id }}"
        state: present
      register: create_result
    - assert:
        that:
          - create_result.changed == true

    - name: "verify present is idempotent (no settings -> no change)"
      solace_cloud_service_v2:
        name: "{{ service_name }}"
        state: present
      register: verify_result
    - assert:
        that:
          - verify_result.changed == false
          - verify_result.response.name == service_name

    - name: "delete service (async, waits for completion)"
      solace_cloud_service_v2:
        name: "{{ service_name }}"
        state: absent
      register: delete_result
    - assert:
        that:
          - delete_result.changed == true

    - name: "verify deleted (present again would create; use absent -> no change)"
      solace_cloud_service_v2:
        name: "{{ service_name }}"
        state: absent
      register: post_delete
    - assert:
        that:
          - post_delete.changed == false

###
# The End.
