#
# Tests solace_cloud_client_profile_v2 against an existing Solace Cloud service.
# Sensitive/account data is read from the environment - nothing is stored in the repo.

-
  name: "solace_cloud_client_profile_v2"
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  collections:
    - solace.pubsub_plus
  vars:
    solace_cloud_api_token: "{{ lookup('env', 'SOLACE_CLOUD_API_TOKEN') }}"
    solace_cloud_home: "{{ lookup('env', 'SOLACE_CLOUD_HOME') | default('us', true) }}"
    solace_cloud_service_id: "{{ lookup('env', 'SOLACE_CLOUD_SERVICE_ID') }}"
    client_profile: "asct_profile_v2"
  module_defaults:
    solace.pubsub_plus.solace_cloud_client_profile_v2:
      solace_cloud_api_token: "{{ solace_cloud_api_token }}"
      solace_cloud_home: "{{ solace_cloud_home }}"
      solace_cloud_service_id: "{{ solace_cloud_service_id }}"
  tasks:
    - name: "check required environment"
      assert:
        that:
          - solace_cloud_api_token | length > 0
          - solace_cloud_service_id | length > 0
        fail_msg: "set env vars SOLACE_CLOUD_API_TOKEN and SOLACE_CLOUD_SERVICE_ID"

    - name: "clean start"
      solace_cloud_client_profile_v2:
        name: "{{ client_profile }}"
        state: absent

    - name: "add client profile"
      solace_cloud_client_profile_v2:
        name: "{{ client_profile }}"
        state: present

    - name: "add again (idempotency)"
      solace_cloud_client_profile_v2:
        name: "{{ client_profile }}"
        state: present
      register: idem
    - assert:
        that:
          - idem.changed == false
        fail_msg: "expected no change on second present"

    - name: "remove client profile"
      solace_cloud_client_profile_v2:
        name: "{{ client_profile }}"
        state: absent
      register: rm
    - assert:
        that:
          - rm.changed == true

###
# The End.
