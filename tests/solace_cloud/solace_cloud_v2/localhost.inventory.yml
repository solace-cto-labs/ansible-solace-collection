#
# No secrets here. The Solace Cloud API token and account-specific ids are read at
# runtime from environment variables by the playbooks (via lookup('env', ...)):
#   SOLACE_CLOUD_API_TOKEN               (required)
#   SOLACE_CLOUD_SERVICE_ID              (required)
#   SOLACE_CLOUD_CONNECTION_ENDPOINT_ID  (required for the hostnames test)
#   SOLACE_CLOUD_HOME                    (optional, default 'us')
#   SOLACE_CLOUD_SERVICE_NAME            (optional, enables the service read test)
---
all:
  hosts:
    localhost:
      ansible_connection: local
