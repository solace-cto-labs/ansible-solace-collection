---

- set_fact:
    rc: 0
  register: solace_broker_service_result
- set_fact:
    solace_broker_service_result:
      rc: 0

- name: validate inputs
  include_tasks: validate.yml

- name: "call docker compose"
  block:
  - name: "docker compose: {{ combined_docker_compose_settings.project_name }}:{{ combined_docker_compose_settings.state }}"
    # migrated from community.general.docker_compose (removed in community.docker 4.0.0,
    # docker-compose v1 EOL). docker_compose_v2 has no 'restarted' param; 'recreate: always'
    # (the role default) provides the equivalent recreate-on-run behaviour.
    community.docker.docker_compose_v2:
      project_name: "{{ combined_docker_compose_settings.project_name }}"
      definition: "{{ combined_docker_compose_settings.definition | default(omit) }}"
      project_src: "{{ combined_docker_compose_settings.project_src | default(omit) }}"
      files: "{{ combined_docker_compose_settings.files | default(omit) }}"
      state: "{{ combined_docker_compose_settings.state | default('present') }}"
      recreate: "{{ combined_docker_compose_settings.recreate | default(omit) }}"
      services: "{{ combined_docker_compose_settings.services | default(omit) }}"
    register: docker_compose_result
  rescue:
  - set_fact:
      solace_broker_service_result:
        rc: 1
        msg:
          community:
            docker:
              docker_compose_v2:
                result: "{{ docker_compose_result }}"
- fail:
    msg: "{{ solace_broker_service_result }}"
  when: solace_broker_service_result.rc != 0

- name: state=present
  include_tasks: present.yml
  when: combined_docker_compose_settings.state == 'present'

- name: state=absent
  include_tasks: absent.yml
  when: combined_docker_compose_settings.state == 'absent'
