name: ansible-test
on:
  # for testing
  workflow_dispatch:
  # # testing branches
  # push:
  #   branches:
  #     - mtn-120

  # schedule:
  #   # - cron: '0 1 * * THU'
  #   - cron: '0 2 * * *'
  pull_request:
    branches:
      - main

env:
  # DEBUG_FLAG: ${{ true }}
  TEST_ANSIBLE_SOLACE_COLLECTION_DIR: "src/ansible_collections/solace/pubsub_plus"
  PIP_DEVEL_REQUIREMENTS_FILE: "devel/devel.requirements.txt"

jobs:
  ansbile_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.13' ]
        ansible-core-version: [
          "ansible-core>=2.19,<2.20", # this is 2.19
          "ansible-core>=2.20,<2.21", # this is 2.20
          "ansible-core>=2.21,<2.22", # this is 2.21
        ]


    steps:
      - name: Check Auth
        if: github.event_name == 'workflow_dispatch' && github.actor != 'ricardojosegomezulmke'
        run: |
          echo "not authorized"
          echo "{IS_AUTHORIZED}={false}" >> $GITHUB_OUTPUT
        id: auth
      - name: Cancel Workflow
        if: ${{ always() && steps.auth.outputs.IS_AUTHORIZED == 'false' }}
        uses: andymckay/cancel-action@0.2

      - name: update packages
        run: |
          # some release files are missing ...
          # sudo apt-get update
          sudo apt-get install libyaml-dev
          sudo apt-get install shellcheck

      - name: check pre-installed versions
        run: |
          lsb_release -a
          which python
          python --version
          which python3
          python3 --version

      - name: Checkout Current Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: setup python matrix version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ansible-core and devel requirements for matrix version
        env:
          ANSIBLE_CORE_VERSION: "${{ matrix.ansible-core-version }}"
        run: |
          python -m pip install --upgrade pip
          pip install "$ANSIBLE_CORE_VERSION"
          pip install -r "${TEST_ANSIBLE_SOLACE_COLLECTION_DIR}/requirements.txt"
          pip install -r "${PIP_DEVEL_REQUIREMENTS_FILE}"

      - name: Print versions
        run: |
          ansible --version
          which ansible-test
          pip3 show ansible-doc-extractor

      - name: Run ansible-test
        run: |
          cd ${TEST_ANSIBLE_SOLACE_COLLECTION_DIR}
          ansible-test sanity


###
# The End.
